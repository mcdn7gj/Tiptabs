name: Build Docker Image

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tiptabs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run health check on built image
        run: |
          docker build -t tiptabs:test .
          docker run --rm -d --name tiptabs-test -p 5000:5000 tiptabs:test
          sleep 5
          curl -f http://localhost:5000/health || exit 1
          docker stop tiptabs-test
