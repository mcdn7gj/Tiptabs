name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Init
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Unit
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Coverage
        run: make coverage

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Init
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: tiptabs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify
        run: |
          docker run --rm -d --name tiptabs-test -p 5000:5000 tiptabs:test
          sleep 5
          curl -f http://localhost:5000/health
          docker stop tiptabs-test
